<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIC Plans</title>
<link rel="icon" type="image/x-icon" href="https://licindia.in/documents/d/guest/lic_log_updated">
<style>
  :root {
    --blue: #1f4e98;
    --blue-dark: #183f7c;
    --yellow: #f5c518;
    --cream: #fff8e6;
    --gold-border: #f0d68f;
    --gold-text: #7a5a00;
    --bg: #f4f6fa;
    --border: #e3e7ee;
    --text: #1f2933;
    --muted: #5b6573;
    --chip: #eef0f4;
  }
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo {
    color: var(--yellow);
    font-weight: 800;
    font-size: 0.95rem;
    letter-spacing: 0.5px;
    padding: 6px 8px;
    border-radius: 4px;
  }
  .brand-title {
    font-weight: 700;
    font-size: 1.05rem;
  }
  .brand-sub {
    font-size: 0.75rem;
    color: var(--muted);
  }
  main {
    max-width: 1120px;
    margin: 0 auto;
    padding: 32px 24px 48px;
  }
  h1 {
    color: var(--blue);
    font-size: 2.4rem;
    margin: 0 0 8px;
  }
  .intro {
    color: var(--muted);
    font-size: 1.1rem;
    margin: 0 0 24px;
  }
  #search {
    width: 100%;
    max-width: 480px;
    padding: 12px 16px;
    font-size: 1rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
  }
  #search:focus {
    outline: 2px solid var(--blue);
    outline-offset: 1px;
  }
  h2 {
    color: var(--blue);
    font-size: 1.4rem;
    margin: 36px 0 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .count {
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--gold-text);
    background: var(--cream);
    border: 1px solid var(--gold-border);
    border-radius: 6px;
    padding: 3px 8px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 16px;
  }
  .card {
    display: flex;
    flex-direction: column;
    gap: 14px;
    background: #fff;
    border: 1px solid var(--border);
    border-top: 5px solid var(--yellow);
    border-radius: 12px;
    padding: 20px;
    text-decoration: none;
    color: inherit;
    box-shadow: 0 1px 3px rgba(16, 24, 40, 0.06);
    transition: box-shadow 0.15s, transform 0.15s;
  }
  .card.d2c {
    border-top-color: var(--blue);
  }
  .card:hover {
    box-shadow: 0 6px 18px rgba(16, 24, 40, 0.12);
    transform: translateY(-2px);
  }
  .card-title {
    color: var(--blue);
    font-size: 1.2rem;
    font-weight: 700;
    line-height: 1.3;
    flex-grow: 1;
  }
  .chip {
    align-self: flex-start;
    background: var(--chip);
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 0.9rem;
    font-weight: 600;
  }
  .btn {
    background: var(--blue);
    color: #fff;
    text-align: center;
    font-weight: 600;
    padding: 11px;
    border-radius: 8px;
  }
  .card:hover .btn {
    background: var(--blue-dark);
  }
  .empty {
    color: var(--muted);
    margin-top: 32px;
  }
  @media (max-width: 600px) {
    h1 {
      font-size: 1.8rem;
    }
    main {
      padding: 24px 16px 40px;
    }
  }
</style>
</head>
<body>
<header>
  <span class="logo"><img src="https://licindia.in/documents/d/guest/lic_log_updated"/></span>
  <div>
    <div class="brand-title">LIC Plans</div>
    <div class="brand-sub">Quick links to buy online</div>
  </div>
</header>
<main>
  <h1>Choose a plan</h1>
  <p class="intro">Tap a plan to open its LIC online purchase page.</p>
  <input id="search" type="search" placeholder="Search by name or plan number">
  <div id="sections"></div>
</main>
<script>
  const BASE_URL = "https://d2conline.licindia.in/eSales/liconline/setprop?plan=";

  const SECTIONS = [
    {
      title: "Plans",
      cardClass: "",
      plans: [
        ["Protection Plus", 886],
        ["Micro Bachat", 751],
        ["Jan Suraksha", 880],
        ["Bima Kavach", 887],
        ["Saral Jeevan Bima", 859],
        ["Bima Jyoti", 760],
        ["Saral Pension", 862],
        ["Smart Pension", 879],
        ["Jeevan Akshay-VII", 857],
        ["New Jeevan Sathi - Single Premium", 888],
        ["New Tech Term", 954],
        ["New Jeevan Sathi - Limited Premium", 889],
        ["Jeevan Raksha", 894],
        ["Bima Platinum", 770],
        ["New Jeevan Dhara II", 892],
        ["New Cancer Cover", 908],
        ["Health Shield", 907],
      ],
    },
    {
      title: "Online D2C",
      cardClass: "d2c",
      plans: [
        ["LIC's Digi Term", 876],
        ["Digi Credit Life", 878],
        ["New Jeevan Shanti", 758],
        ["Jeevan Utsav Single Premium", 883],
        ["Nav Jeevan Shree", 912],
        ["Jeevan Utsav", 771],
        ["Amritbaal", 774],
        ["Bima Lakshmi", 881],
        ["Nivesh Plus", 749],
        ["SIIP", 752],
        ["New Pension Plus", 867],
        ["Index Plus", 873],
      ],
    },
  ];

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function createCard(name, num, cardClass) {
    const card = el("a", ("card " + cardClass).trim());
    card.href = BASE_URL + num;
    card.target = "_blank";
    card.rel = "noopener noreferrer";
    card.append(
      el("div", "card-title", name),
      el("span", "chip", "Plan " + num),
      el("span", "btn", "Open plan →"));
    return card;
  }

  function render(filter) {
    const container = document.getElementById("sections");
    container.replaceChildren();
    const query = filter.trim().toLowerCase();

    for (const section of SECTIONS) {
      const matches = section.plans.filter(([name, num]) =>
        name.toLowerCase().includes(query) || String(num).includes(query));
      if (matches.length === 0) continue;

      const heading = el("h2", "", section.title);
      heading.append(el("span", "count", matches.length + " PLANS"));
      const grid = el("div", "grid");
      for (const [name, num] of matches) {
        grid.append(createCard(name, num, section.cardClass));
      }
      container.append(heading, grid);
    }

    if (!container.hasChildNodes()) {
      container.append(el("p", "empty", "No plans match your search."));
    }
  }

  document.getElementById("search").addEventListener("input", e => render(e.target.value));
  render("");
</script>
</body>
</html>
